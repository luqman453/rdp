name: CI

on: [push, workflow_dispatch]

jobs:

  build:

    runs-on: windows-latest

    steps:

    # Step 1: Download the latest ngrok version
    - name: Download Latest Ngrok
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

    # Step 2: Extract the ngrok archive
    - name: Extract Ngrok
      run: Expand-Archive ngrok.zip -DestinationPath .

    # Step 3: Authenticate ngrok with your token
    - name: Authenticate Ngrok
      run: .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    # Step 4: Enable Terminal Services for Remote Desktop
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # Step 5: Set Remote Desktop User Authentication
    - run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    # Step 6: Set Local User Password
    - run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Shani*.12" -Force)

    # Step 7: Create Ngrok Tunnel
    - name: Create Ngrok Tunnel
      run: .\ngrok.exe tcp 3389
